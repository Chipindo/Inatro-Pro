<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Carta Mestre - Exame Teórico 3</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* VARIAVEIS DE CORES */
:root {
    --primary: #04182B !important;
    --primary-light: #112B47 !important;
    --green: #00D37F !important;
    --red: #EF4444 !important;
    --orange: #F59E0B !important;
    --bg: #F0F4F8 !important;
    --card: #ffffff !important;
    --text: #1F2937 !important;
    --muted: #9CA3AF !important;
    --blue-active: #3B82F6 !important;
}

/* SISTEMA ANTI-CÓPIA & RESET */
* {
    margin: 0; padding: 0; box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', sans-serif;
    transition: all 0.2s ease-in-out;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
    -webkit-touch-callout: none; text-decoration: none;
}

html, body {
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background-color: var(--bg);
    color: var(--text);
    display: flex; 
    flex-direction: column;
}

/* ================= TOPO FIXO (HEADER + NAV) ================= */
.fixed-top-area {
    flex-shrink: 0;
    width: 100%;
    position: relative;
    z-index: 1000;
}

header {
    background: var(--primary);
    width: 100%; 
    padding: 15px 15px 45px 15px;
    border-radius: 0 0 30px 30px;
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    gap: 8px;
}

.brand-container {
    min-width: 0; /* Permite encolher se necessário para não empurrar os botões */
    flex-shrink: 1;
}

.brand-title { 
    font-size: 1.35rem; 
    font-family: 'Montserrat', sans-serif; 
    font-weight: 900; 
    color: white;
    letter-spacing: -0.5px; 
    line-height: 1.1;
    white-space: nowrap;
}
.brand-title span { color: var(--green); }
.brand-subtitle { 
    font-size: 0.7rem; 
    font-weight: 600; 
    color: white;
    opacity: 0.8; 
    margin-top: 3px; 
    text-transform: uppercase; 
    letter-spacing: 0.5px;
    white-space: nowrap;
}

.header-right { 
    display: flex; 
    gap: 6px; 
    align-items: center; 
    flex-shrink: 0;
}

.timer-box {
    background: var(--primary-light); 
    color: white;
    padding: 7px 10px; 
    border-radius: 10px; 
    border: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; gap: 5px; 
    font-weight: 700; font-size: 0.85rem;
    white-space: nowrap;
}
.timer-box i { font-size: 0.85rem; color: var(--orange); }

.btn-terminar {
    background: var(--red); color: white; border: none;
    padding: 8px 12px; border-radius: 10px; font-weight: 700; cursor: pointer;
    font-size: 0.75rem; text-transform: uppercase;
    white-space: nowrap;
}
.btn-terminar:active { transform: scale(0.95); }

/* ================= BARRA DE PAGINAÇÃO ================= */
.nav-wrapper {
    width: 100%; max-width: 600px; 
    margin: -24px auto 0 auto;
    display: flex; align-items: center; gap: 10px;
    padding: 0 15px;
}
.nav-container {
    display: flex; align-items: center; gap: 10px; 
    overflow-x: auto; scrollbar-width: none;
    flex-grow: 1; padding: 10px 0;
}
.nav-container::-webkit-scrollbar { display: none; }

.nav-btn {
    background: var(--card); color: var(--primary); border: none;
    width: 48px; height: 48px; border-radius: 14px; font-size: 1.1rem;
    display: flex; justify-content: center; align-items: center;
    cursor: pointer; flex-shrink: 0; 
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
}
.nav-btn:active { background: #E5E7EB; }

.page-num {
    min-width: 48px; height: 48px; 
    background: var(--card); color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    border-radius: 14px; font-weight: 700; cursor: pointer; 
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04); 
    font-size: 1rem; flex-shrink: 0;
}
.page-num.active { 
    background: var(--blue-active); 
    color: white; 
    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4); 
    transform: translateY(-2px);
}
.page-num.answered { border-bottom: 4px solid var(--green); color: var(--primary); font-weight: 800; }

.page-num.rev-correct { background: var(--green) !important; color: white !important; border-bottom: none; }
.page-num.rev-wrong { background: var(--red) !important; color: white !important; border-bottom: none; }

/* ================= ÁREA DE CONTEÚDO ROLÁVEL ================= */
.scrollable-content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 15px 40px 15px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.container { width: 100%; max-width: 580px; }

.question-wrapper { display: none; animation: fadeIn 0.3s ease; }
.question-wrapper.active { display: block; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.card-inner {
    background: var(--card); 
    border-radius: 24px; 
    padding: 25px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.03); 
}

.q-img { 
    width: 100%; height: auto; max-height: 250px; 
    object-fit: contain; border-radius: 12px; 
    margin-bottom: 25px; pointer-events: none; display: block; 
}
.q-text-area { 
    font-weight: 800; font-size: 1.15rem; 
    color: var(--primary); margin-bottom: 25px; 
    line-height: 1.4; 
}

/* ================= OPÇÕES ================= */
.options-container { display: flex; flex-direction: column; gap: 14px; }

.option {
    display: flex; align-items: center; background: var(--card);
    border: 1.5px solid #E5E7EB; border-radius: 16px; padding: 12px 16px;
    cursor: pointer; font-size: 0.95rem; font-weight: 600; color: var(--text);
}
.option:hover { border-color: #D1D5DB; }
.option input { display: none; }

.option-letter {
    background: var(--primary); color: white; border-radius: 12px;
    width: 42px; height: 42px; display: flex; align-items: center;
    justify-content: center; font-weight: 800; margin-right: 16px; 
    flex-shrink: 0; font-size: 1rem;
}

/* Estado Selecionado */
.option:has(input:checked) { 
    border-color: var(--blue-active); 
    background: #F3F8FF; 
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.08); 
}
.option:has(input:checked) .option-letter { background: var(--blue-active); }

/* Correção Final */
.correct-ans { background: #ECFDF5 !important; border-color: var(--green) !important; }
.correct-ans .option-letter { background: var(--green) !important; }
.wrong-ans { background: #FEF2F2 !important; border-color: var(--red) !important; }
.wrong-ans .option-letter { background: var(--red) !important; }

.label-certa {
    background: var(--green); color: white; font-size: 0.7rem; padding: 5px 10px;
    border-radius: 8px; margin-left: auto; font-weight: 800; display: none; text-transform: uppercase;
}

.exam-finished .option { pointer-events: none; }

/* ================= MODAL DE RESULTADO ================= */
.modal-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(4, 24, 43, 0.85); backdrop-filter: blur(8px);
    z-index: 2000; justify-content: center; align-items: center; padding: 20px;
}
.modal-content {
    background: white; width: 100%; max-width: 380px; border-radius: 28px;
    padding: 40px 30px; text-align: center; position: relative; 
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

#modalIcon i { font-size: 4.5rem; margin-bottom: 15px; }
.modal-status { font-size: 2rem; font-family: 'Montserrat', sans-serif; font-weight: 900; margin-bottom: 25px; letter-spacing: -0.5px; }
.status-reprovado { color: var(--red); }
.status-aprovado { color: var(--green); }

.modal-stats { 
    display: flex; justify-content: space-between; background: #F9FAFB; 
    padding: 20px; border-radius: 20px; margin-bottom: 30px; border: 1px solid #E5E7EB; 
}
.modal-stats div { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 0.75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; width: 33%; }
.modal-stats .divider { width: 1px; background: #E5E7EB; height: 40px; align-self: center; }
.stat-value { font-size: 1.6rem; font-weight: 800; color: var(--primary); line-height: 1; }
.text-green { color: var(--green); }
.text-red { color: var(--red); }

.modal-footer { display: flex; flex-direction: column; gap: 12px; }
.btn-ver {
    background: var(--blue-active); color: white; padding: 16px; border-radius: 16px;
    font-weight: 700; cursor: pointer; text-transform: uppercase; font-size: 0.9rem; border: none; width: 100%;
}
.btn-sair {
    background: #F3F4F6; color: var(--primary); padding: 16px; border-radius: 16px;
    font-weight: 700; cursor: pointer; text-transform: uppercase; font-size: 0.9rem; border: none; width: 100%;
}

</style>
</head>

<!-- AREA FIXA NO TOPO -->
<div class="fixed-top-area">
    <header>
        <div class="brand-container">
            <div class="brand-title">CARTA<span>MESTRE</span></div>
            <div class="brand-subtitle">Exame Teórico 3</div>
        </div>
        <div class="header-right">

        <button class="nav-btn" onclick="nextQ()"><i class="fas fa-chevron-right"></i></button>
    </div>
</div>

<!-- AREA DE SCROLL PARA AS PERGUNTAS -->
<div class="scrollable-content">

    </div>
</div>

<div class="modal-overlay" id="modalRes">

        <div class="modal-stats">

            <div class="divider"></div>
            <div><span id="resErros" class="stat-value text-red">25</span> Erros</div>
            <div class="divider"></div>
            <div><span id="resMedia" class="stat-value">0</span> Pontos</div>
        </div>
        
        <div class="modal-footer">
            <button class="btn-ver" onclick="closeModal()"><i class="fas fa-search"></i> Ver Correção</button>
            <button class="btn-sair" onclick="window.location.href='exames-pesados.html'"><i class="fas fa-arrow-left"></i> Voltar à Lista</button>
        </div>
    </div>
</div>

    let currentIdx = 0;
    let time = 3600;
    let countdown;
    let isExamFinished = false;
    let userAnswers = {};

    function init() {
        renderQuestions();
        startTimer();
    }

    function renderQuestions() {
        document.getElementById('q_list').innerHTML = '';
        document.getElementById('pagination_bar').innerHTML = '';
        questions.forEach((item, index) => {
            document.getElementById('pagination_bar').innerHTML += `<div class="page-num ${index === 0 ? 'active' : ''}" id="page_${index}" onclick="goToQuestion(${index})">${index + 1}</div>`;

            let optionsHtml = '';
            for(let key in item.options) {
                optionsHtml += `
                    <label class="option" id="label-${item.id}-${key}">
                        <div class="option-letter">${key}</div>
                        <input type="radio" name="q${item.id}" value="${key}" onchange="saveProgress(${index}, '${item.id}', '${key}')">
                        <span>${item.options[key]}</span>
                        <span class="label-certa" id="certa-${item.id}-${key}">CORRETA</span>
                    </label>`;
            }

            document.getElementById('q_list').innerHTML += `
                <div class="question-wrapper ${index === 0 ? 'active' : ''}" id="q_wrap_${index}">
                    <div class="card-inner">
                        <img src="${item.img}" class="q-img" loading="lazy">
                        <div class="q-text-area">${item.q}</div>
                        <div class="options-container">${optionsHtml}</div>
                    </div>
                </div>`;
        });
    }

    function saveProgress(index, qId, val) {
        if (isExamFinished) return;
        userAnswers[`q${qId}`] = val;
        document.getElementById(`page_${index}`).classList.add('answered');
        setTimeout(() => nextQ(), 400);
    }

    function startTimer() {
        clearInterval(countdown);
        countdown = setInterval(() => {
            if (time <= 0) { checkExam(); } else { time--; updateTimerDisplay(); }
        }, 1000);
    }

    function updateTimerDisplay() {
        let m = Math.floor(time / 60), s = time % 60;
        document.getElementById('timer').innerHTML = `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function goToQuestion(index) {
        if (index < 0 || index >= questions.length) return;
        currentIdx = index;
        document.querySelectorAll('.question-wrapper').forEach(w => w.classList.remove('active'));
        document.querySelectorAll('.page-num').forEach(p => p.classList.remove('active'));
        document.getElementById(`q_wrap_${index}`).classList.add('active');
        document.getElementById(`page_${index}`).classList.add('active');
        
        document.getElementById(`page_${index}`).scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        document.querySelector('.scrollable-content').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function nextQ() { goToQuestion(currentIdx + 1); }
    function prevQ() { goToQuestion(currentIdx - 1); }

    async function checkExam() {
        if (isExamFinished) return;
        clearInterval(countdown);
        isExamFinished = true;
        
        document.getElementById('exam').classList.add('exam-finished');
        
        let score = 0;
        questions.forEach((item, index) => {
            const userAns = userAnswers[`q${item.id}`];
            const isCorrect = userAns === item.ans;
            
            document.getElementById(`label-${item.id}-${item.ans}`).classList.add('correct-ans');
            document.getElementById(`certa-${item.id}-${item.ans}`).style.display = 'block';
            
            if (userAns && !isCorrect) {
                document.getElementById(`label-${item.id}-${userAns}`).classList.add('wrong-ans');
            }

            const pageBtn = document.getElementById(`page_${index}`);
            if (isCorrect) {
                score++;
                pageBtn.classList.add('rev-correct');
            } else {
                pageBtn.classList.add('rev-wrong');
            }
        });

        showModal(score);

        const totalErros = questions.length - score;
        const percentagem = Math.round((score / questions.length) * 100);

        try {
            const userDataJson = localStorage.getItem('usuarioLogado');
            if (userDataJson) {
                const userData = JSON.parse(userDataJson);
                
                await _supabase.from('Historico_Exames').insert([{ 
                    user_id: userData.id, 
                    modulo: 'pesados', 
                    percentagem: percentagem, 
                    acertos: score, 
                    erros: totalErros 
                }]);
            }
        } catch(e) {
            console.error('Erro ao guardar histórico:', e);
        }

        const dadosParaSalvar = {
            nome: NOME_DO_EXAME,
            acertos: score,
            total: questions.length,
            data: new Date().toLocaleDateString('pt-MZ')
        };
        localStorage.setItem(EXAME_ID_UNICO, JSON.stringify(dadosParaSalvar));
    }

    function showModal(score) {
        const aprovado = score >= 18;
        const modal = document.getElementById('modalRes');
        const title = document.getElementById('modalTitle');
        const iconDiv = document.getElementById('modalIcon');
        
        title.innerText = aprovado ? "Aprovado" : "Reprovado";
        title.className = "modal-status " + (aprovado ? "status-aprovado" : "status-reprovado");
        
        iconDiv.innerHTML = aprovado 
            ? '<i class="fas fa-check-circle" style="color: var(--green);"></i>' 
            : '<i class="fas fa-times" style="color: var(--red);"></i>';
        
        document.getElementById('resAcertos').innerText = score;
        document.getElementById('resErros').innerText = questions.length - score;
        document.getElementById('resMedia').innerText = score;
        
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modalRes').style.display = 'none';
        document.getElementById('btnFinish').style.display = 'none';
        goToQuestion(0);
    }

    init();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    async function caoDeGuarda() {
        const userDataJson = localStorage.getItem('usuarioLogado');
        if (!userDataJson) {
            window.location.href = 'index.html';
            return;
        }

        try {
            // Inicializa o Supabase nesta página específica
            const SUPABASE_URL = 'https://vhcioxwuombrqkhkipdh.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_XW2XlyZRe0IOotl6fpRXGQ_w6_-32AF';
            const sClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            const user = JSON.parse(userDataJson);
            
            // Verifica o estado atual na base de dados
            const { data } = await sClient
                .from('Utilizadores')
                .select('mensagem_admin, banido')
                .eq('id', user.id)
                .single();

            if (data) {
                const isBanido = data.banido === true || (data.mensagem_admin && data.mensagem_admin.includes('[BANIDO]'));
                if (isBanido) {
                    localStorage.removeItem('usuarioLogado');
                    window.location.replace('index.html'); 
                }
            }
        } catch (e) {
            console.log("Modo offline ativo ou sem internet.");
        }
    }

    // Executa ao abrir e repete a cada 30 segundos
    caoDeGuarda();
    setInterval(caoDeGuarda, 30000);
</script>
